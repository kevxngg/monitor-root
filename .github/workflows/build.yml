name: Compilar APK

on:
  push:
    branches: [ main ]
    # Cambios solo en la web, el README o el propio flujo no generan una versión nueva de la app
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MonitorRoot.apk

      - name: Datos de actualización (update.json)
        run: |
          python3 - <<'PY'
          import json, os
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "build": build,
              "notes": open("RELEASE_NOTES.md", encoding="utf-8").read(),
              "apk": f"https://github.com/{repo}/releases/download/build-{build}/MonitorRoot.apk",
              "size": os.path.getsize("MonitorRoot.apk"),
          }
          json.dump(data, open("update.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorRoot
          path: MonitorRoot.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monitor Root (build ${{ github.run_number }})
          files: |
            MonitorRoot.apk
            update.json
          body_path: RELEASE_NOTES.md
