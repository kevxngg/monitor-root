name: Compilar APK

on:
  push:
    # "pruebas": compila sin publicar nada en Releases (para probar antes)
    branches: [ main, pruebas ]
    # Cambios solo en la web, el README o el propio flujo no generan una versión nueva de la app
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.es.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Comprobar que la versión es nueva
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -Fxq "Monitor $APP_VERSION"; then
            echo "::error::La versión $APP_VERSION ya está publicada. Sube el número del archivo VERSION."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Claves de firma (desde los Secrets)
        env:
          OLD_KS: ${{ secrets.SIGNING_OLD_KEYSTORE }}
          NEW_KS: ${{ secrets.SIGNING_NEW_KEYSTORE }}
        run: |
          umask 077
          echo "$OLD_KS" | base64 -d > "$RUNNER_TEMP/old.jks"
          echo "$NEW_KS" | base64 -d > "$RUNNER_TEMP/new.p12"
          echo "SIGNING_OLD_KEYSTORE_FILE=$RUNNER_TEMP/old.jks" >> "$GITHUB_ENV"

      - name: Probar y compilar
        env:
          SIGNING_OLD_PASS: ${{ secrets.SIGNING_OLD_PASS }}
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A 2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      # Rotación de clave (APK Signature Scheme v3): la clave antigua autoriza a la
      # nueva. En Android 9+, tras instalar esta versión, el teléfono deja de aceptar
      # actualizaciones firmadas solo con la clave antigua. Android 8 sigue usando
      # la antigua (no admite rotación).
      - name: Firmar con rotación de clave
        env:
          SIGNING_OLD_PASS: ${{ secrets.SIGNING_OLD_PASS }}
          SIGNING_NEW_PASS: ${{ secrets.SIGNING_NEW_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OLD="--ks $RUNNER_TEMP/old.jks --ks-key-alias monitor --ks-pass env:SIGNING_OLD_PASS --key-pass env:SIGNING_OLD_PASS"
          NEW="--ks $RUNNER_TEMP/new.p12 --ks-type PKCS12 --ks-key-alias monitor2026 --ks-pass env:SIGNING_NEW_PASS --key-pass env:SIGNING_NEW_PASS"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" --old-signer $OLD --new-signer $NEW
          "$BT/apksigner" sign $OLD --next-signer $NEW --lineage "$RUNNER_TEMP/lineage.bin" \
            --rotation-min-sdk-version 28 --in app/build/outputs/apk/release/app-release.apk --out MonitorRoot.apk
          "$BT/apksigner" verify --verbose --print-certs MonitorRoot.apk | grep -E "Verified using|certificate SHA-256" | head -12

      - name: Borrar las claves
        if: always()
        run: rm -f "$RUNNER_TEMP/old.jks" "$RUNNER_TEMP/new.p12" "$RUNNER_TEMP/lineage.bin"

      - name: Datos de actualización (update.json)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          # MIN_BUILD: builds menores que este número tienen que actualizar (0 = nunca se obliga)
          min_build = int(open("MIN_BUILD").read().strip() or 0) if os.path.exists("MIN_BUILD") else 0
          data = {
              "build": build,
              "notes": open("RELEASE_NOTES.md", encoding="utf-8").read(),
              "apk": f"https://github.com/{repo}/releases/download/build-{build}/MonitorRoot.apk",
              "size": os.path.getsize("MonitorRoot.apk"),
              "sha256": hashlib.sha256(open("MonitorRoot.apk", "rb").read()).hexdigest(),
              "min_build": min_build,
              "version": os.environ["APP_VERSION"],
          }
          json.dump(data, open("update.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorRoot
          path: MonitorRoot.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monitor ${{ env.APP_VERSION }}
          files: |
            MonitorRoot.apk
            update.json
          body_path: RELEASE_NOTES.md
