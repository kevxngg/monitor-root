name: Build APK

on:
  push:
    # "pruebas" (test branch): builds without publishing anything to Releases
    branches: [ main, pruebas ]
    # Changes only to the website, the README or this workflow do not produce a new app version
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.es.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Check that the version is new
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -Fxq "Monitor $APP_VERSION"; then
            echo "::error::Version $APP_VERSION is already published. Bump the number in the VERSION file."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Signing keys (from Secrets)
        env:
          OLD_KS: ${{ secrets.SIGNING_OLD_KEYSTORE }}
          NEW_KS: ${{ secrets.SIGNING_NEW_KEYSTORE }}
        run: |
          umask 077
          echo "$OLD_KS" | base64 -d > "$RUNNER_TEMP/old.jks"
          echo "$NEW_KS" | base64 -d > "$RUNNER_TEMP/new.p12"
          echo "SIGNING_OLD_KEYSTORE_FILE=$RUNNER_TEMP/old.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_OLD_PASS: ${{ secrets.SIGNING_OLD_PASS }}
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A 2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      # Key rotation (APK Signature Scheme v3): the old key authorizes the new one.
      # On Android 9+, once this version is installed, the phone stops accepting
      # updates signed only with the old key. Android 8 keeps using the old key
      # (it does not support rotation).
      - name: Sign with key rotation
        env:
          SIGNING_OLD_PASS: ${{ secrets.SIGNING_OLD_PASS }}
          SIGNING_NEW_PASS: ${{ secrets.SIGNING_NEW_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OLD="--ks $RUNNER_TEMP/old.jks --ks-key-alias monitor --ks-pass env:SIGNING_OLD_PASS --key-pass env:SIGNING_OLD_PASS"
          NEW="--ks $RUNNER_TEMP/new.p12 --ks-type PKCS12 --ks-key-alias monitor2026 --ks-pass env:SIGNING_NEW_PASS --key-pass env:SIGNING_NEW_PASS"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" --old-signer $OLD --new-signer $NEW
          "$BT/apksigner" sign $OLD --next-signer $NEW --lineage "$RUNNER_TEMP/lineage.bin" \
            --rotation-min-sdk-version 28 --in app/build/outputs/apk/release/app-release.apk --out MonitorRoot.apk
          "$BT/apksigner" verify --verbose --print-certs MonitorRoot.apk | grep -E "Verified using|certificate SHA-256" | head -12

      - name: Delete the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/old.jks" "$RUNNER_TEMP/new.p12" "$RUNNER_TEMP/lineage.bin"

      - name: Update data (update.json)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          # MIN_BUILD: builds below this number must update (0 = never forced)
          min_build = int(open("MIN_BUILD").read().strip() or 0) if os.path.exists("MIN_BUILD") else 0
          data = {
              "build": build,
              "notes": open("RELEASE_NOTES.md", encoding="utf-8").read(),
              "apk": f"https://github.com/{repo}/releases/download/build-{build}/MonitorRoot.apk",
              "size": os.path.getsize("MonitorRoot.apk"),
              "sha256": hashlib.sha256(open("MonitorRoot.apk", "rb").read()).hexdigest(),
              "min_build": min_build,
              "version": os.environ["APP_VERSION"],
          }
          json.dump(data, open("update.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MonitorRoot
          path: MonitorRoot.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monitor ${{ env.APP_VERSION }}
          files: |
            MonitorRoot.apk
            update.json
          body_path: RELEASE_NOTES.md
