name: Compilar APK

on:
  push:
    # "pruebas": compila sin publicar nada en Releases (para probar antes)
    branches: [ main, pruebas ]
    # Cambios solo en la web, el README o el propio flujo no generan una versión nueva de la app
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.es.md'
      - '.github/**'
      - 'rom/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Probar y compilar
        run: |
          set -o pipefail
          gradle testStandardDebugUnitTest assembleStandardRelease assembleSystemRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A 2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/standard/release/app-standard-release.apk MonitorRoot.apk
          cp app/build/outputs/apk/system/release/app-system-release.apk MonitorRoot-system.apk

      - name: Firmar la edición de sistema con la clave de prueba de AOSP
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --key rom/testkey/platform.pk8 --cert rom/testkey/platform.x509.pem \
            --out MonitorRoot-system-testkey.apk MonitorRoot-system.apk
          "$BT/apksigner" verify --print-certs MonitorRoot-system-testkey.apk | head -3

      - name: Datos de actualización (update.json)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import json, os
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          # MIN_BUILD: builds menores que este número tienen que actualizar (0 = nunca se obliga)
          min_build = int(open("MIN_BUILD").read().strip() or 0) if os.path.exists("MIN_BUILD") else 0
          data = {
              "build": build,
              "notes": open("RELEASE_NOTES.md", encoding="utf-8").read(),
              "apk": f"https://github.com/{repo}/releases/download/build-{build}/MonitorRoot.apk",
              "size": os.path.getsize("MonitorRoot.apk"),
              "min_build": min_build,
          }
          json.dump(data, open("update.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorRoot
          path: |
            MonitorRoot.apk
            MonitorRoot-system.apk
            MonitorRoot-system-testkey.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monitor Root (build ${{ github.run_number }})
          files: |
            MonitorRoot.apk
            MonitorRoot-system.apk
            MonitorRoot-system-testkey.apk
            update.json
          body_path: RELEASE_NOTES.md
